# Docker Compose for Local Superset Build
version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis cache
  redis:
    image: redis:7
    container_name: superset_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Superset application - built locally
  superset:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-superset:latest
    container_name: superset_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: your-secret-key-here-change-in-production
      DATABASE_URL: postgresql+psycopg2://superset:superset@db:5432/superset
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLASK_APP: "superset.app:create_app()"
      SUPERSET_LOAD_EXAMPLES: "yes"
    volumes:
      - superset_data:/app/superset_home
      - ./superset_config_local.py:/app/pythonpath/superset_config.py
    command: >
      bash -c "
      echo 'Waiting for database to be ready...' &&
      sleep 10 &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  db_data:
  superset_data:
