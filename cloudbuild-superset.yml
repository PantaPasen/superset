# Cloud Build configuration for Superset deployment
# Optimized for existing VM with service account setup
# Triggered on push to master/main branches

steps:
  # Step 1: Set up authentication using the VM's existing service account
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Setting up authentication for Superset deployment..."
        
        # Set the project (should match your VM's project)
        gcloud config set project $_PROJECT_ID
        
        # List available service accounts
        echo "Available service accounts:"
        gcloud auth list
        
        echo "Authentication setup completed"

  # Step 2: Sync source code to VM
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Syncing Superset source code to VM..."
        
        # Create a temporary archive of the source code
        tar -czf /tmp/superset-source.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='*.log' \
          --exclude='superset_env' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          .
        
        # Copy the source code to the VM
        gcloud compute scp /tmp/superset-source.tar.gz $_INSTANCE_NAME:/tmp/superset-source.tar.gz \
          --zone=$_ZONE \
          --project=$_PROJECT_ID
        
        echo "Superset source code synced successfully"

  # Step 3: Deploy using gcloud compute ssh with existing service account
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Starting Superset deployment to $_INSTANCE_NAME..."
        
        # Use gcloud compute ssh to connect to the VM
        # This leverages the existing service account on the VM
        gcloud compute ssh $_INSTANCE_NAME \
          --zone=$_ZONE \
          --project=$_PROJECT_ID \
          --command="
            set -e
            echo 'Connected to VM successfully'
            
            # Create project directory if it doesn't exist
            echo 'Creating project directory...'
            mkdir -p $_PROJECT_PATH
            
            # Navigate to project directory
            cd $_PROJECT_PATH
            echo \"Current directory: \$(pwd)\"
            
            # Verify service account is available
            echo 'Checking service account...'
            if [ -f '/home/lucasnilsson/superset/service-account.json' ]; then
              echo '✅ Service account file found'
            else
              echo '⚠️  Service account file not found at expected location'
            fi
            
            echo \"Directory contents: \$(ls -la)\"
            
            # Create backup of current state
            echo 'Creating backup...'
            if [ -d '.' ] && [ \"\$(ls -A .)\" ]; then
              BACKUP_DIR=\"../superset-backup-\$(date +%Y%m%d-%H%M%S)\"
              sudo cp -r . \"\$$BACKUP_DIR\" 2>/dev/null || cp -r . \"\$$BACKUP_DIR\"
              echo \"✅ Backup created at \$$BACKUP_DIR\"
            else
              echo 'No existing files to backup'
            fi
            
            # Extract synced source code
            echo 'Extracting synced source code...'
            if [ -f '/tmp/superset-source.tar.gz' ]; then
              # Extract directly to current directory (overwriting existing files)
              tar -xzf /tmp/superset-source.tar.gz -C .
              echo '✅ Source code extracted successfully to \$(pwd)'
              echo \"Updated directory contents: \$(ls -la)\"
            else
              echo '❌ Source code archive not found'
              exit 1
            fi
            
            # Set proper permissions
            echo 'Setting permissions...'
            # Get current user for ownership
            CURRENT_USER=$$(whoami)
            echo \"Current user: $$CURRENT_USER\"
            
            # Try with sudo first, fallback to direct commands if user is root
            if command -v sudo >/dev/null 2>&1 && [ \"$$CURRENT_USER\" != \"root\" ]; then
              echo 'Using sudo for permission changes...'
              sudo chmod -R 755 . || chmod -R 755 . || true
              sudo chown -R $$CURRENT_USER:$$CURRENT_USER . || chown -R $$CURRENT_USER:$$CURRENT_USER . || true
            else
              echo 'Running as root or sudo not available, using direct commands...'
              chmod -R 755 . || true
              chown -R root:root . || true
            fi
            
            # Install Docker if not present
            echo 'Checking Docker installation...'
            if ! command -v docker &> /dev/null; then
              echo 'Installing Docker...'
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
              sudo usermod -aG docker $$USER
              sudo systemctl start docker
              sudo systemctl enable docker
              echo '✅ Docker installed and started'
            else
              echo '✅ Docker already installed'
            fi
            
            # Install Docker Compose if not present
            if ! command -v docker-compose &> /dev/null; then
              echo 'Installing Docker Compose...'
              sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              echo '✅ Docker Compose installed'
            else
              echo '✅ Docker Compose already installed'
            fi
            
            # Create necessary directories
            echo 'Creating necessary directories...'
            mkdir -p superset_home logs uploads cache
            
            # Set permissions for Superset directories
            if command -v sudo >/dev/null 2>&1 && [ \"$$CURRENT_USER\" != \"root\" ]; then
              sudo chmod -R 777 superset_home logs uploads cache || chmod -R 777 superset_home logs uploads cache || true
              sudo chown -R $$CURRENT_USER:$$CURRENT_USER superset_home logs uploads cache || chown -R $$CURRENT_USER:$$CURRENT_USER superset_home logs uploads cache || true
            else
              chmod -R 777 superset_home logs uploads cache || true
              chown -R root:root superset_home logs uploads cache || true
            fi
            
            # Restart services with proper Docker handling
            echo 'Restarting Superset services...'
            if command -v sudo >/dev/null 2>&1 && [ \"$$CURRENT_USER\" != \"root\" ]; then
              sudo docker-compose down || docker-compose down || true
              sudo rm -rf logs/* || rm -rf logs/* || true
              sudo docker-compose build --no-cache || docker-compose build --no-cache
              sudo docker-compose up -d || docker-compose up -d
            else
              docker-compose down || true
              rm -rf logs/* || true
              docker-compose build --no-cache
              docker-compose up -d
            fi
            
            # Wait for services to be healthy
            echo 'Waiting for services to start...'
            sleep 45
            
            # Check if services are running
            echo 'Checking service status...'
            CURRENT_USER=$$(whoami)
            if command -v sudo >/dev/null 2>&1 && [ \"$$CURRENT_USER\" != \"root\" ]; then
              sudo docker-compose ps || docker-compose ps
            else
              docker-compose ps
            fi
          "

  # Step 4: Verify deployment and service account integration
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying Superset deployment and service account integration..."
        
        gcloud compute ssh $_INSTANCE_NAME \
          --zone=$_ZONE \
          --project=$_PROJECT_ID \
          --command="
            cd $_PROJECT_PATH
            
            # Check if all containers are running
            echo 'Checking container status...'
            CURRENT_USER=$$(whoami)
            if command -v sudo >/dev/null 2>&1 && [ \"$$CURRENT_USER\" != \"root\" ]; then
              DOCKER_PS_OUTPUT=$$(sudo docker-compose ps 2>/dev/null || docker-compose ps 2>/dev/null)
            else
              DOCKER_PS_OUTPUT=$$(docker-compose ps 2>/dev/null)
            fi
            
            if echo \"$$DOCKER_PS_OUTPUT\" | grep -q 'Up'; then
              echo '✅ All Superset services are running successfully'
            else
              echo '❌ Some Superset services failed to start'
              echo 'Container status:'
              echo \"$$DOCKER_PS_OUTPUT\"
              if command -v sudo >/dev/null 2>&1 && [ \"$$CURRENT_USER\" != \"root\" ]; then
                sudo docker-compose logs --tail=50 || docker-compose logs --tail=50
              else
                docker-compose logs --tail=50
              fi
              exit 1
            fi
            
            # Verify service account is accessible
            echo 'Verifying service account accessibility...'
            if [ -f '/home/lucasnilsson/superset/service-account.json' ]; then
              echo '✅ Service account file is accessible to Superset'
              # Test if the service account key is valid JSON
              if python3 -m json.tool /home/lucasnilsson/superset/service-account.json >/dev/null 2>&1; then
                echo '✅ Service account file is valid JSON'
              else
                echo '⚠️  Service account file may have formatting issues'
              fi
            else
              echo '⚠️  Service account file not found at /home/lucasnilsson/superset/service-account.json'
            fi
            
            # Check Superset webserver health
            echo 'Checking Superset webserver health...'
            sleep 15
            for i in {1..5}; do
              if curl -f http://localhost:8088/health 2>/dev/null; then
                echo '✅ Superset webserver is healthy'
                break
              else
                echo \"Attempt \$i: Superset webserver not yet ready, waiting...\"
                sleep 15
              fi
            done
            
            # Check if Superset is accessible
            echo 'Checking Superset accessibility...'
            if curl -f http://localhost:8088/ 2>/dev/null | grep -q 'Superset'; then
              echo '✅ Superset is accessible and responding'
            else
              echo '⚠️  Superset might not be fully loaded yet'
            fi
          "

  # Step 5: External verification
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Performing external verification..."
        
        # Get the external IP of the instance
        EXTERNAL_IP=$$(gcloud compute instances describe $_INSTANCE_NAME --zone=$_ZONE --project=$_PROJECT_ID --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
        
        if [ -z "$$EXTERNAL_IP" ]; then
          echo "Could not retrieve external IP, trying with provided IP: $_HOST_IP"
          EXTERNAL_IP=$_HOST_IP
        fi
        
        echo "Testing external access to: $$EXTERNAL_IP"
        
        # Check from Cloud Build runner with retries
        for i in {1..3}; do
          if curl -f --connect-timeout 10 http://$$EXTERNAL_IP:8088/ 2>/dev/null; then
            echo "✅ Superset is accessible from external network"
            break
          else
            echo "Attempt $$i: External access not ready, waiting..."
            sleep 20
          fi
        done
        
        # Check if Superset is accessible from external network
        sleep 15
        if curl -f --connect-timeout 10 http://$$EXTERNAL_IP:8088/ 2>/dev/null | grep -q "Superset"; then
          echo "✅ Superset is fully accessible externally"
        else
          echo "⚠️  Superset might not be fully loaded yet or not accessible externally"
        fi

  # Step 6: Deployment summary
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EXTERNAL_IP=$$(gcloud compute instances describe $_INSTANCE_NAME --zone=$_ZONE --project=$_PROJECT_ID --format='get(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || echo $_HOST_IP)
        
        echo "🚀 Superset deployment completed successfully!"
        echo "📊 Deployment Summary:"
        echo "  • Instance: $_INSTANCE_NAME"
        echo "  • Zone: $_ZONE"
        echo "  • Project: $_PROJECT_ID"
        echo "  • Service Account: 593948307303-compute@developer.gserviceaccount.com"
        echo "  • Superset URL: http://$$EXTERNAL_IP:8088"
        echo ""
        echo "🔧 Service Account Status: ✅ Configured and Active"
        echo "🐳 Docker Services: ✅ Running"
        echo "📊 Superset: ✅ Accessible"

# Options
options:
  logging: CLOUD_LOGGING_ONLY

# Timeout (25 minutes for more complex operations)
timeout: '1500s'

# Required substitutions - these need to be set in the trigger
substitutions:
  _PROJECT_ID: 'bower-eu-data-warehouse'  # Your GCP project ID
  _INSTANCE_NAME: 'bower-superset-test'   # Your VM instance name
  _ZONE: 'europe-north1-a'                # Your VM zone (e.g., europe-north1-a)
  _PROJECT_PATH: '/home/lucasnilsson/superset'         # Path to your project on the VM
  _HOST_IP: '35.228.129.82'              # Fallback IP for external verification

# Service account permissions required:
# - Compute Instance Admin (v1) or Compute Admin
# - Service Account User (if using a different service account)
# - Storage Admin (for accessing the source code)
