[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# PostgreSQL Service
[program:postgresql]
command=/usr/local/bin/postgres -D /var/lib/postgresql/data
user=postgres
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_error.log
priority=100
startsecs=10

# Redis Service
[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
user=redis
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_error.log
priority=200
startsecs=5

# Superset Web Application
[program:superset]
command=/usr/local/bin/gunicorn --bind 0.0.0.0:8088 --workers 2 --threads 10 --timeout 300 --keepalive 2 --max-requests 1000 --max-requests-jitter 100 "superset.app:create_app()"
directory=/app
user=superset
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/superset.log
stderr_logfile=/var/log/supervisor/superset_error.log
priority=400
startsecs=30
environment=PYTHONPATH="/app/pythonpath",SUPERSET_CONFIG_PATH="/app/pythonpath/superset_config.py",DATABASE_DIALECT="postgresql",DATABASE_HOST="localhost",REDIS_HOST="localhost"

# Celery Worker for Background Tasks
[program:celery-worker]
command=/usr/local/bin/celery --app=superset.tasks.celery_app:app worker --loglevel=info --concurrency=2 --hostname=worker@%%h
directory=/app
user=superset
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/celery-worker.log
stderr_logfile=/var/log/supervisor/celery-worker_error.log
priority=300
startsecs=30
environment=PYTHONPATH="/app/pythonpath",SUPERSET_CONFIG_PATH="/app/pythonpath/superset_config.py",DATABASE_DIALECT="postgresql",DATABASE_HOST="localhost",REDIS_HOST="localhost",C_FORCE_ROOT="1"

# Celery Beat for Scheduled Tasks
[program:celery-beat]
command=/usr/local/bin/celery --app=superset.tasks.celery_app:app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
directory=/app
user=superset
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/celery-beat.log
stderr_logfile=/var/log/supervisor/celery-beat_error.log
priority=350
startsecs=30
environment=PYTHONPATH="/app/pythonpath",SUPERSET_CONFIG_PATH="/app/pythonpath/superset_config.py",DATABASE_DIALECT="postgresql",DATABASE_HOST="localhost",REDIS_HOST="localhost",C_FORCE_ROOT="1"

# Group all services
[group:superset-all]
programs=postgresql,redis,celery-worker,celery-beat,superset
priority=999 